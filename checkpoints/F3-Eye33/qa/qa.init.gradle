allprojects { afterEvaluate {
 sourceSets.main.java.srcDir(new File(rootDir, '../qa/qa-src'))
 neoForge.runs.client {
  systemProperty 'kelmagic.eyeV3','true'
  systemProperty 'kelmagic.eyeV3.label', System.getenv('EYE_LABEL') ?: 'AFTER'
  systemProperty 'kelmagic.eyeV3.output', System.getenv('EYE_OUTPUT') ?: new File(rootDir,'../captures/after').absolutePath
  programArgument '--width';programArgument '1200';programArgument '--height';programArgument '800'
  jvmArgument '-Xmx1400m'
 }
}}
